<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halloween-Krimi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="10 schaurige Krimi-Logikrätsel zu Halloween.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Creepster&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: Halloween-Spiel bei Nacht – Levelkarte als Kürbispfad, Spielbrett randlos breit, leuchtendes Orange als einzige Akzentfarbe */
:root{
  --night:#140b22; --night-2:#24113a; --plum:#3a1b55;
  --panel:rgba(34,17,52,.86); --edge:#5c3380;
  --orange:#ff8a1f; --orange-d:#c4560b; --gold:#ffd166;
  --text:#f7ecdc; --muted:#bba8cc; --ok:#8fd14f; --bad:#ff6b6b; --wall:#24132b;
  --logo:"Creepster","Chiller",fantasy,cursive;
  --ui:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--night);color:var(--text);font:600 15px/1.4 var(--ui);-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

/* Nachthimmel */
.sky{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:radial-gradient(circle at 82% 9%,rgba(255,220,150,.28) 0,rgba(255,170,80,.08) 16%,transparent 34%),
  linear-gradient(180deg,#120a20 0%,#26123d 45%,#3a1a3c 80%,#4a2032 100%)}
.stars{position:absolute;inset:0;background-image:radial-gradient(1.2px 1.2px at 10% 12%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 30% 22%,#fff 50%,transparent 51%),radial-gradient(1.4px 1.4px at 55% 8%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 70% 30%,#fff 50%,transparent 51%),radial-gradient(1.2px 1.2px at 22% 40%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 45%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 45% 52%,#fff 50%,transparent 51%),radial-gradient(1.3px 1.3px at 5% 60%,#fff 50%,transparent 51%);opacity:.6}
.moon{position:absolute;right:9%;top:3%;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 38% 38%,#fff6d8,#f3d68f 60%,#d9b56a);box-shadow:0 0 40px 10px rgba(255,214,140,.35)}
.moon::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(190,150,80,.35);left:20px;top:34px;box-shadow:22px -14px 0 -3px rgba(190,150,80,.3),16px 10px 0 -5px rgba(190,150,80,.3)}
.bat{position:absolute;width:34px;height:16px;animation:fly 18s linear infinite}
.bat svg{width:100%;height:100%;animation:flap .35s ease-in-out infinite alternate}
@keyframes fly{from{transform:translate(-60px,0)}to{transform:translate(110vw,-40px)}}
@keyframes flap{to{transform:scaleY(.45)}}
.leaf{position:absolute;top:-30px;opacity:.7;filter:saturate(.8);animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-30px) rotate(0)}100%{transform:translate(60px,110vh) rotate(540deg)}}
.hills{position:absolute;left:0;right:0;bottom:0;height:120px}
.fog{position:absolute;left:-20%;right:-20%;bottom:0;height:140px;background:radial-gradient(ellipse at 30% 100%,rgba(200,180,230,.18),transparent 60%),radial-gradient(ellipse at 75% 100%,rgba(200,180,230,.14),transparent 60%);animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(6%)}}
@media (prefers-reduced-motion:reduce){.bat,.bat svg,.leaf,.fog{animation:none}.leaf{display:none}}

.app{position:relative;z-index:1;max-width:640px;margin:0 auto;padding-block:10px 30px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
@media (min-width:360px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* Startbildschirm */
.logo{position:relative;text-align:center;padding:24px 0 6px}
.logo .lg1{position:absolute;left:2%;top:10px;width:58px;transform:rotate(-12deg);animation:bob 3s ease-in-out infinite;filter:drop-shadow(0 0 10px rgba(255,255,255,.35))}
.logo .lg2{position:absolute;right:20%;top:-4px;width:46px;transform:rotate(10deg);animation:bob 2.4s ease-in-out infinite reverse}
@keyframes bob{50%{translate:0 -8px}}
.logo h1{font-family:var(--logo);font-weight:400;font-size:clamp(46px,14vw,74px);line-height:.95;margin:0;color:var(--orange);text-shadow:0 0 18px rgba(255,138,31,.55),0 4px 0 #6b2a05;letter-spacing:.02em}
.logo p{margin:8px 0 0;color:var(--muted);font-size:15px}
.stats{display:flex;justify-content:center;gap:10px;margin:14px 0 4px}
.pill{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:6px 14px;font-weight:800;font-size:15px}
.pill .pi{width:22px;height:22px}
.pill.btn{border-color:var(--orange);color:var(--gold)}
.map{position:relative;margin:10px auto 0;width:100%;max-width:440px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;width:120px}
.node .pk{position:relative;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#3d2156,#1d0f2c);border:3px solid var(--edge);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 0 #10081a,0 8px 20px rgba(0,0,0,.5);transition:transform .15s}
.node .pk img{width:54px;height:54px;filter:saturate(.55) brightness(.62);transition:filter .2s}
.node.done .pk img,.node.next .pk img{filter:none}
.node.done .pk img{filter:drop-shadow(0 0 8px rgba(255,160,60,.8))}
.node:active .pk{transform:translateY(3px);box-shadow:0 3px 0 #10081a}
.node.done .pk{border-color:var(--orange);box-shadow:0 6px 0 #10081a,0 0 26px rgba(255,138,31,.55)}
.node.next .pk{border-color:var(--gold);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 6px 0 #10081a,0 0 30px 6px rgba(255,209,102,.55)}}
.node .num{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;background:var(--orange);color:#2a1205;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;border:2px solid #2a1205}
.node .nm{font-weight:800;font-size:13px;text-align:center;line-height:1.15;text-shadow:0 2px 4px #000;margin-top:4px}
.node .st{font-size:13px;letter-spacing:1px;color:#5c4a6e;line-height:1}
.node .st b{color:var(--gold);font-weight:400}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.foot button{text-decoration:underline;margin-top:6px;font-size:12px;color:var(--muted)}

/* Spielbildschirm */
.hud{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.rb{flex:none;width:42px;height:42px;border-radius:14px;background:var(--panel);border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:900;box-shadow:0 4px 0 #10081a}
.rb:active{transform:translateY(2px);box-shadow:0 2px 0 #10081a}
.rb .hb{width:22px;height:22px}
.rb.hint{width:auto;padding:0 12px;gap:6px;font-size:14px;border-color:var(--orange);color:var(--gold)}
.hud .t{flex:1;min-width:0;text-align:center}
.hud .lv{font-size:11px;font-weight:800;color:var(--orange);letter-spacing:.12em;text-transform:uppercase}
.hud h2{margin:0;font-family:var(--logo);font-weight:400;font-size:clamp(19px,5.6vw,25px);line-height:1.05;letter-spacing:.03em;color:var(--text);text-wrap:balance}
.timer{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.timer .sw{width:14px;height:14px}
.story{background:var(--panel);border:2px solid var(--edge);border-radius:14px;padding:7px 12px;font-size:14px;line-height:1.35;margin-bottom:8px;text-align:center}
.story b{color:var(--gold)}
.frame{background:linear-gradient(180deg,#5a3418,#3b200d);border-radius:16px;padding:5px;box-shadow:0 0 0 2px #1a0d05,0 0 30px rgba(255,138,31,.25),0 10px 24px rgba(0,0,0,.5)}
.board{position:relative;width:100%;aspect-ratio:1;user-select:none;touch-action:manipulation;border-radius:12px;overflow:hidden}
.board > svg{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;display:grid}
.cell{position:relative;cursor:pointer;min-width:0}
.cell .rl{position:absolute;z-index:2;top:4px;left:4px;font-size:9.5px;font-weight:900;letter-spacing:.03em;text-transform:uppercase;color:#fff;background:rgba(36,19,43,.78);border-radius:6px;padding:1px 5px;line-height:1.3;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .x{position:absolute;inset:22%;pointer-events:none}
.av{display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--c);color:#fff;font-weight:900;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.35);flex:none}
.av img{width:78%;height:78%;object-fit:contain}
.av.vic{background:#3a2a4a}
.cell .av{position:absolute;z-index:3;right:5%;bottom:5%;width:60%;height:60%;font-size:clamp(15px,4.6vw,24px);animation:pop .22s cubic-bezier(.3,1.6,.6,1)}
@keyframes pop{from{transform:scale(.3)}to{transform:scale(1)}}
.cell.conflict .av{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad)}
.cell.hinted .av{box-shadow:0 0 0 3px var(--gold),0 0 16px var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:center;font-size:12.5px;color:var(--muted);margin:8px 0 2px}
.legend span{display:flex;align-items:center;gap:4px}
.legend svg{width:22px;height:22px}
.legend .tag{font-size:10.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.legend .tag.free{color:var(--ok)}.legend .tag.no{color:var(--bad)}
.team{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:6px}
.who{display:flex;align-items:center;gap:5px;background:var(--panel);border:2px solid var(--edge);border-radius:999px;padding:2px 10px 2px 2px;font-weight:800;font-size:13.5px;box-shadow:0 3px 0 #10081a}
.who .av{width:25px;height:25px;font-size:13px;border-width:2px}
.who.sel{border-color:var(--orange);background:#4a2414;box-shadow:0 3px 0 #10081a,0 0 14px rgba(255,138,31,.5)}
.who.placed{opacity:.45}
.who.tool{color:var(--muted)}
.who.tool .av{background:transparent;border:2px dashed var(--muted);color:var(--muted);box-shadow:none}
.status{text-align:center;font-size:13px;color:var(--muted);min-height:19px;margin-top:6px}
.status.warn{color:var(--bad)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 2px 6px}
.tools .status{text-align:left;margin:0;flex:1;min-width:0}
.xbtn{flex:none;font-weight:900;font-size:13.5px;padding:7px 12px;border-radius:12px;background:var(--panel);border:2px dashed var(--muted);color:var(--muted)}
.xbtn.on{border-style:solid;border-color:var(--bad);color:#fff;background:#5a1f2a}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sus{position:relative;display:flex;flex-direction:column;gap:6px;text-align:left;background:#f6ecd9;color:#2a1a2e;border-radius:12px;padding:8px 8px 9px;box-shadow:0 4px 0 #10081a;border:3px solid transparent;min-width:0}
.sus:nth-child(odd){transform:rotate(-.6deg)}.sus:nth-child(even){transform:rotate(.6deg)}
.sus .top{display:flex;align-items:center;gap:7px;min-width:0}
.sus .av{width:38px;height:38px;font-size:19px;border-width:3px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.sus .nmx{flex:1;min-width:0;font-family:"Caveat",cursive;font-weight:700;font-size:22px;line-height:1;overflow-wrap:anywhere}
.sus .ck{flex:none;width:24px;height:24px;border-radius:7px;border:2px solid #b9a78f;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;cursor:pointer}
.sus .bub{background:#fff;border-radius:10px;padding:6px 8px;font-size:14px;line-height:1.3;font-weight:700;position:relative}
.sus .bub::before{content:"";position:absolute;left:14px;top:-6px;border:6px solid transparent;border-top:0;border-bottom-color:#fff}
.sus.sel{border-color:var(--orange);box-shadow:0 4px 0 #10081a,0 0 16px rgba(255,138,31,.55)}
.sus.placed .top{opacity:.55}
.sus.used .ck{background:var(--ok);border-color:var(--ok)}
.sus.used .bub{opacity:.45;text-decoration:line-through}
.sus.vic{background:#ead3d6;grid-column:1/-1}
.sus.vic .nmx{text-decoration:line-through;text-decoration-color:var(--bad)}
.note{display:flex;align-items:center;gap:10px;margin-top:10px;background:#6a5a9a;border-radius:999px;padding:6px 16px 6px 8px;font-weight:800;font-size:15px;box-shadow:0 4px 0 #10081a;width:max-content;max-width:100%;margin-left:auto}
.note img{width:30px;height:30px;flex:none}
.clues{background:var(--panel);border:2px solid var(--edge);border-radius:16px;padding:10px 12px;margin-top:10px}
.clues h3{margin:0 0 4px;font-family:var(--logo);font-weight:400;font-size:22px;color:var(--orange);letter-spacing:.04em}
.clue{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;padding:6px 2px;font-size:15px;line-height:1.35;border-top:1px solid rgba(255,255,255,.07)}
.clue .ck{flex:none;width:20px;height:20px;border-radius:6px;border:2px solid var(--edge);margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:13px;color:#2a1205}
.clue.used .ck{background:var(--ok);border-color:var(--ok)}
.clue.used .tx{opacity:.4;text-decoration:line-through}
.clue.rule{color:var(--gold);font-weight:700}
.clue.rule .ck{border-color:var(--gold);color:var(--gold)}
.nm2{font-weight:900}

/* Fenster */
.modal{position:fixed;inset:0;z-index:20;background:rgba(10,5,18,.72);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal.on{display:flex}
.card{position:relative;width:100%;max-width:400px;max-height:100%;overflow:auto;background:linear-gradient(180deg,#3a1b55,#24113a);border:3px solid var(--orange);border-radius:22px;padding:22px 20px 20px;text-align:center;box-shadow:0 0 40px rgba(255,138,31,.35);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(20px) scale(.95);opacity:0}}
.card h3{margin:0 0 6px;font-family:var(--logo);font-weight:400;font-size:34px;color:var(--orange);letter-spacing:.03em;text-shadow:0 3px 0 #6b2a05}
.card p{margin:6px 0 14px;color:var(--text);font-size:16px}
.card ol{text-align:left;padding-left:22px;margin:8px 0 16px;font-size:15px}
.card li{margin:6px 0}
.card .big img{width:92px;height:92px;filter:drop-shadow(0 0 16px rgba(255,160,60,.5))}
.bigstars{display:flex;justify-content:center;gap:6px;margin:6px 0 4px}
.bigstars span{transform:scale(0);animation:star .4s cubic-bezier(.3,1.7,.6,1) forwards}
.bigstars img{width:50px;height:50px;filter:grayscale(1) brightness(.45)}
.bigstars span.on img{filter:drop-shadow(0 0 10px rgba(255,209,102,.7))}

.bigstars span:nth-child(2){animation-delay:.15s}.bigstars span:nth-child(3){animation-delay:.3s}
@keyframes star{to{transform:scale(1)}}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.acts.col{flex-direction:column;align-items:stretch}
.btn{font-weight:900;font-size:16px;padding:11px 18px;border-radius:14px;background:#4a2d66;border:2px solid var(--edge);box-shadow:0 4px 0 #10081a}
.btn.go{background:linear-gradient(180deg,#ffa043,#e8700f);border-color:#ffc27a;color:#2a1205;box-shadow:0 4px 0 #8a3a05}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #10081a}
.burst{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.burst i{position:absolute;left:50%;top:45%;width:26px;height:26px;animation:boom 1.3s ease-out forwards}
@keyframes boom{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.burst{display:none}.node.next .pk{animation:none}}
/* Kompakte Spielansicht */
.app{padding-block:6px 20px}
.hud{gap:6px;margin-bottom:6px}
.rb{width:38px;height:38px;border-radius:12px;font-size:17px;box-shadow:0 3px 0 #10081a}
.rb.hint{width:38px;padding:0}
.rb .hb{width:24px;height:24px}
.hud .lv{display:flex;align-items:center;justify-content:center;gap:4px;font-size:10.5px;letter-spacing:.08em}
.hud .lv .sw{width:12px;height:12px}
.hud .lv #timer{font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--muted)}
.hud h2{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame{padding:3px;border-radius:14px}
.legend{flex-wrap:nowrap;gap:2px 8px;font-size:12px;margin:6px 0 0;white-space:nowrap;overflow-x:auto}
.legend svg{width:18px;height:18px}
.legend .tag{font-size:13px}
.tools{margin:6px 0 6px}
.tools .status{font-size:12px;line-height:1.25}
.xbtn{padding:5px 10px;font-size:12.5px}
.cards{grid-template-columns:1fr;gap:5px}
.sus{flex-direction:row;align-items:center;gap:8px;padding:5px 8px 5px 5px;border-radius:12px;box-shadow:0 3px 0 #10081a;border-width:2px;transform:none!important}
.sus .av{width:30px;height:30px;font-size:15px;border-width:2px}
.sus .txt{flex:1;min-width:0;font-size:14px;line-height:1.25}
.sus .nmx{font-family:var(--ui);font-weight:900;font-size:14px;overflow-wrap:normal}
.sus .bub{background:none;padding:0;font-weight:700;font-size:14px}
.sus .bub::before{display:none}
.sus .ck{width:22px;height:22px}
.sus.placed .av{opacity:.5}
.sus.vic{grid-column:auto}
.sus.vic .nmx{text-decoration:none}
.note{margin:2px 0 0;width:auto;border-radius:12px;padding:4px 10px 4px 6px;font-size:13.5px;box-shadow:0 3px 0 #10081a}
.note img{width:24px;height:24px}
.tools.placing{background:#4a2414;border:2px solid var(--orange);border-radius:12px;padding:4px 6px}
.tools.placing .status{color:var(--gold);font-weight:800;font-size:13px}
.tools .av{width:26px;height:26px;font-size:13px;border-width:2px}
.frame.placing{box-shadow:0 0 0 2px #1a0d05,0 0 0 4px var(--orange),0 0 26px rgba(255,138,31,.6)}
.cell{-webkit-user-select:none}
.palette{display:flex;gap:6px;justify-content:center;margin:8px 0 4px}
.tool{width:44px;height:44px;border-radius:12px;background:var(--panel);border:2px solid var(--edge);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;color:#fff;box-shadow:0 3px 0 #10081a;position:relative}
.tool:not(.x){background:var(--c);border-color:rgba(255,255,255,.5)}
.tool img{width:28px;height:28px}
.tool.x{color:var(--bad);font-size:22px}
.tool.on{border-color:#fff;box-shadow:0 0 0 3px var(--orange),0 3px 0 #10081a;transform:translateY(-2px)}
.tool.done{opacity:.45}
.tool.done.on{opacity:1}
.status{text-align:center;font-size:12px;color:var(--muted);min-height:16px;margin:2px 0 6px}
.status.placing{color:var(--gold);font-weight:800}
.sus{cursor:default}
.sus .ck{background:none;cursor:pointer;width:28px;height:28px;flex:none;border-radius:8px;border:2px solid #b9a78f;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;color:#fff}
.note{display:flex;align-items:center;gap:8px}
.note span{flex:1;min-width:0}
.note .ck{width:26px;height:26px;border-radius:8px;border:2px solid rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex:none}
.note.used .ck{background:var(--ok);border-color:var(--ok)}
.note.used span{opacity:.5;text-decoration:line-through}
.cards .note{margin:0}
.clearall{display:block;width:100%;margin-top:14px;padding:11px;border-radius:12px;border:2px solid var(--bad);color:var(--bad);font-weight:900;font-size:15px;background:rgba(90,31,42,.35)}
</style>
</head>
<body>

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function starStr(n){ return [0,1,2].map(i => i < n ? "<b>★</b>" : "★").join(""); }
function fmt(s){ return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); }

function rules(){
  showModal(`<div class="big">${img("magnifying_glass_tilted_left")}</div><h3>Willkommen, Detektiv!</h3>

    <li>Sitze und Böden (z.&nbsp;B. Stuhl, Spinnennetz, Laubhaufen) und leere Felder können besetzt sein. Hindernisse (z.&nbsp;B. Kürbis, Sarg, Grabstein) <b>nicht</b>.</li>
    <li>„<b>Neben</b>“ heißt direkt darüber, darunter, links oder rechts – und im selben Raum.</li>
    <li>„<b>Ecke</b>“: wo zwei Wände eines Raumes aufeinandertreffen.</li>

const MAPX = [50, 74, 62, 32, 24, 46, 72, 76, 50, 28];
function home(){
  cur = null; clearInterval(tick);

  for (let i=1;i<pts.length;i++){ const [x0,y0] = pts[i-1], [x1,y1] = pts[i]; d += ` C${x0} ${y0+STEP*.55} ${x1} ${y1-STEP*.55} ${x1} ${y1}`; }
  let nodes = "";

    <div class="stats"><span class="pill">${img("glowing_star","pi")} ${total} / 30</span><span class="pill">${img("jack-o-lantern","pi")} ${solvedN} / 10</span><button class="pill btn" id="rulesBtn">Regeln</button></div>

  app.querySelectorAll(".node").forEach(b => b.onclick = () => openCase(+b.dataset.id));
  document.getElementById("rulesBtn").onclick = rules;
  document.getElementById("resetAll").onclick = () => ask("Fortschritt löschen?", "Löschen", () => {
    stars = {}; store.set("stars", stars); PUZZLES.forEach(p => store.set("state"+p.id, null)); home(); });
  window.scrollTo(0,0);
  if (!store.get("seen", false)) rules();
}

function openCase(id){
  const p = PUZZLES.find(x => x.id === id), st = store.get("state"+id, null);
  cur = { p, place: st ? st.place : p.persons.map(() => null), marks: new Set(st ? st.marks : []), used: new Set(st ? st.used : []),
          hints: st ? st.hints || 0 : 0, hinted: new Set(), sel: null, mark: false, msg: "", warn: false, t0: Date.now() - (st && st.time ? st.time*1000 : 0), done: false };
  cur.plan = planSvg(p);
  try{ history.replaceState(null, "", "#"+id); }catch(e){}
  render(); window.scrollTo(0,0);
  clearInterval(tick);
  tick = setInterval(() => { const el = document.getElementById("timer"); if (el && cur && !cur.done) el.textContent = fmt(secs()); }, 1000);
}
function secs(){ return Math.floor((Date.now() - cur.t0) / 1000); }
function save(){ store.set("state"+cur.p.id, { place: cur.place, marks: [...cur.marks], used: [...cur.used], hints: cur.hints, time: secs() }); }
function whoAt(r,c){ return cur.place.findIndex(x => x && x[0]===r && x[1]===c); }
function conflicts(){
  const bad = new Set();
  cur.place.forEach((a,i) => { if (!a) return; cur.place.forEach((b,j) => { if (i!==j && b && (a[0]===b[0] || a[1]===b[1])) bad.add(i); }); });
  return bad;
}

function planSvg(p){
  const n = p.n, S = 100, W = n*S, pal = ROOMS.map((_,k) => ROOMS[(k + p.id*2) % ROOMS.length]);
  let s = `<svg viewBox="0 0 ${W} ${W}" aria-hidden="true">`;
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const col = pal[p.rooms[r][c]];
    s += `<rect x="${c*S}" y="${r*S}" width="${S}" height="${S}" fill="${col}"/>`
       + `<rect x="${c*S+5}" y="${r*S+5}" width="${S-10}" height="${S-10}" rx="10" fill="#fff" opacity="${(r+c)%2 ? .14 : .22}"/>`;
  }
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const t = p.cells[r][c];
    if (!t) continue;
    const name = p.objects[t].icon;
    if (t===2) s += `<use href="#hw-${name}" x="${c*S+12}" y="${r*S+16}" width="76" height="76" opacity=".9"/>`;
    else s += `<use href="#hw-${name}" x="${c*S+12}" y="${r*S+14}" width="78" height="78"/>`;
  }
  let w = "";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    if (c<n-1 && p.rooms[r][c]!==p.rooms[r][c+1]) w += `M${(c+1)*S} ${r*S}V${(r+1)*S}`;
    if (r<n-1 && p.rooms[r][c]!==p.rooms[r+1][c]) w += `M${c*S} ${(r+1)*S}H${(c+1)*S}`;
  }
  s += `<path d="${w}" stroke="#24132b" stroke-width="9" stroke-linecap="round" fill="none"/>`
     + `<rect x="0" y="0" width="${W}" height="${W}" fill="none" stroke="#24132b" stroke-width="10"/>`;
  return s + `</svg>`;
}

function clueHtml(text){
  const ps = cur.p.persons, order = ps.map((_,i) => i).sort((a,b) => ps[b].length - ps[a].length);
  const re = new RegExp(order.map(i => ps[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  let out = "", last = 0, m;
  while ((m = re.exec(text))){ const i = ps.indexOf(m[0]); out += esc(text.slice(last, m.index)) + `<span class="nm2" style="color:${i===0 ? "#d9c8e8" : PCOL[i]}">${esc(m[0])}</span>`; last = m.index + m[0].length; }
  return out + esc(text.slice(last));
}

function render(){
  const p = cur.p, n = p.n, o = p.objects, bad = conflicts();
  const first = {}, span = {};
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const k = p.rooms[r][c]; let run = 1;
    while (c+run<n && p.rooms[r][c+run]===k) run++;
    if (!(k in span) || run > span[k] + (r - +first[k].split(",")[0]) * 0.34){ span[k] = run; first[k] = r+","+c; }
  }
  let g = "";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const k = p.rooms[r][c], t = p.cells[r][c], who = whoAt(r,c);
    let inner = first[k]===r+","+c ? `<span class="rl" style="max-width:calc(${span[k]*100}% - 8px)">${esc(p.roomNames[k])}</span>` : "";
    if (who>=0) inner += avatar(p, who);
    else if (cur.marks.has(r+","+c)) inner += XMARK;
    const cls = ["cell"]; if (who>=0 && bad.has(who)) cls.push("conflict"); if (who>=0 && cur.hinted.has(who)) cls.push("hinted");
    g += `<div class="${cls.join(" ")}" data-r="${r}" data-c="${c}" title="${esc(p.roomNames[k])}${t?" · "+esc(o[t].name):""}">${inner}</div>`;
  }
  const order = [...p.persons.keys()].slice(1).concat([0]);
  const cards = order.map(i => `<div class="sus${i===0?" vic":""}${cur.place[i]?" placed":""}${cur.used.has(i)?" used":""}">${avatar(p,i)}<span class="txt"><b class="nmx" style="color:${i===0 ? "#7a5a8a" : PCOL[i]}">${esc(p.persons[i])}${i===0 ? " (Opfer)" : ""}</b> <span class="bub">${esc(p.cards[i])}</span></span><button class="ck" data-ck="${i}" role="checkbox" aria-checked="${cur.used.has(i)}" aria-label="Aussage abhaken">${cur.used.has(i)?"✓":""}</button></div>`).join("");
  const notes = p.notes.map((t,j) => `<div class="note${cur.used.has("n"+j)?" used":""}">${img("magnifying_glass_tilted_left")}<span>${esc(t)}</span><button class="ck" data-ck="n${j}" aria-label="Hinweis abhaken">${cur.used.has("n"+j)?"✓":""}</button></div>`).join("");
  const pal = `<button class="tool x${cur.sel===null?" on":""}" data-tool="x" aria-label="Kreuz">✕</button>` + p.persons.map((_,i) => i).slice(1).concat([0]).map(i =>
    `<button class="tool${cur.sel===i?" on":""}${cur.place[i]?" done":""}" data-tool="${i}" style="--c:${PCOL[i]}" aria-label="${esc(p.persons[i])} setzen">${i===0 ? img("skull") : esc(p.persons[i][0])}</button>`).join("");
  const lg = t => `<span>${ico(o[t].icon)}${esc(o[t].name)}</span>`;
  const legend = `<span class="tag free">✓</span>${lg(1)}${lg(2)}<span class="tag no">✕</span>${lg(3)}${lg(4)}`;
  const status = cur.msg || (cur.sel === null ? "✕ gewählt: Feld antippen zum Ankreuzen." : `Tippe das Feld für ${p.persons[cur.sel]} an.`);
  app.innerHTML = `
  <div class="hud"><button class="rb" id="back" aria-label="Zur Karte">←</button>
    <div class="t"><div class="lv">Fall ${p.id}/${PUZZLES.length} · <img src="${IMG.stopwatch}" alt="" class="sw"><span id="timer">${fmt(secs())}</span></div><h2>${esc(p.title)}</h2></div>
    <button class="rb hint" id="hint" aria-label="Tipp">${img("light_bulb","hb")}</button><button class="rb" id="menu" aria-label="Menü">⋯</button></div>
  <div class="frame${cur.sel !== null ? " placing" : ""}"><div class="board">${cur.plan}<div class="ov" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${g}</div></div></div>
  <div class="legend">${legend}</div>
  <div class="palette">${pal}</div>
  <div class="status${cur.warn?" warn":""}${cur.sel !== null ? " placing" : ""}">${esc(status)}</div>
  <div class="cards">${cards}${notes}</div>
  <button class="clearall" id="clearAll">Einträge löschen</button>`;
  bind();
}

function bind(){
  document.getElementById("back").onclick = home;
  document.getElementById("menu").onclick = menu;
  document.getElementById("hint").onclick = hint;
  app.querySelectorAll(".cell").forEach(el => el.onclick = () => tap(+el.dataset.r, +el.dataset.c));
  app.querySelectorAll("[data-ck]").forEach(el => el.onclick = () => {
    const k = el.dataset.ck, key = k[0] === "n" ? k : +k;
    cur.used.has(key) ? cur.used.delete(key) : cur.used.add(key); save(); render();
  });
  app.querySelectorAll("[data-tool]").forEach(el => el.onclick = () => {
    const t = el.dataset.tool; cur.sel = t === "x" ? null : (cur.sel === +t ? null : +t); cur.msg = ""; cur.warn = false; render();
  });
  document.getElementById("clearAll").onclick = () => ask("Alle Einträge löschen?", "Löschen", () => {
    cur.place = cur.p.persons.map(() => null); cur.marks.clear(); cur.used.clear(); cur.hinted.clear(); cur.sel = null; cur.msg = ""; save(); render(); });
}

function hint(){
  const p = cur.p;
  const i = p.persons.findIndex((_, k) => !cur.place[k] || cur.place[k][0] !== p.solution[k][0] || cur.place[k][1] !== p.solution[k][1]);
  if (i < 0) return;
  const [r,c] = p.solution[i];
  const other = whoAt(r,c); if (other >= 0) cur.place[other] = null;
  cur.place.forEach((x,k) => { if (k !== i && x && (x[0]===r || x[1]===c)) cur.place[k] = null; });
  cur.place[i] = [r,c]; cur.marks.delete(r+","+c); cur.hints++; cur.hinted.add(i);
  cur.msg = `Tipp: ${p.persons[i]} steht jetzt richtig.`; cur.warn = false;
  cur.sel = null;
  save(); check();
}

function menu(){
  const p = cur.p;
  showModal(`<h3>${esc(p.title)}</h3><div class="acts col" style="margin-top:14px">
    <button class="btn" id="mRules">Regeln</button><button class="btn" id="mReset">Neu starten</button>
    <button class="btn" id="mReveal">Lösung zeigen</button><button class="btn go" id="mClose">Weiterspielen</button></div>`);
  document.getElementById("mClose").onclick = closeModal;
  document.getElementById("mRules").onclick = rules;
  document.getElementById("mReset").onclick = () => { closeModal(); ask("Fall neu starten?", "Neu starten", () => {
    store.set("state"+p.id, null); openCase(p.id); }); };
  document.getElementById("mReveal").onclick = () => { closeModal(); ask("Lösung zeigen? Dafür gibt es keine Sterne.", "Zeigen", () => {
    cur.place = p.solution.map(x => [...x]); cur.done = true; save(); render(); win(true); }); };
}

function tap(r,c){
  if (cur.done) return;
  const p = cur.p, key = r+","+c, who = whoAt(r,c);
  cur.msg = ""; cur.warn = false;
  if (cur.sel === null){
    // Normalfall: Kreuz setzen/entfernen – oder gesetzte Person wieder wegnehmen
    if (who >= 0){ cur.place[who] = null; cur.hinted.delete(who); cur.msg = `${p.persons[who]} wurde entfernt.`; save(); render(); return; }
    cur.marks.has(key) ? cur.marks.delete(key) : cur.marks.add(key);
    save(); render(); return;
  }
  if (BLOCKED.includes(p.cells[r][c])){ cur.msg = `${p.objects[p.cells[r][c]].name}: Hier kann niemand stehen.`; cur.warn = true; render(); return; }
  if (who >= 0 && who !== cur.sel){ cur.place[who] = null; cur.hinted.delete(who); }
  cur.place[cur.sel] = [r,c]; cur.hinted.delete(cur.sel);
  cur.marks.delete(key);
  cur.sel = null;
  save(); check();
}

function check(){
  const p = cur.p;
  if (cur.place.every(x => x)){
    const ok = p.solution.every((s,i) => cur.place[i][0]===s[0] && cur.place[i][1]===s[1]);
    if (ok){ cur.done = true; render(); win(false); return; }
    cur.msg = "Alle stehen, aber etwas stimmt noch nicht."; cur.warn = true;
  }
  render();
}

function burst(){
  const b = document.createElement("div"); b.className = "burst";
  const cols = ["#e8741f","#d93b2b","#e8b23a","#ffd166"];
  for (let i=0;i<28;i++){
    const a = Math.random()*Math.PI*2, d = 120 + Math.random()*200;
    b.insertAdjacentHTML("beforeend", `<i style="--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px;--r:${Math.random()*720}deg"><img src="${IMG[["maple_leaf","fallen_leaf","glowing_star"][i%3]]}" alt="" style="width:100%"></i>`);
  }
  document.body.appendChild(b); setTimeout(() => b.remove(), 1500);
}

function win(revealed){
  const p = cur.p, [vr,vc] = p.solution[0], room = p.roomNames[p.rooms[vr][vc]], t = secs();
  const s = revealed ? 0 : Math.max(1, 3 - cur.hints);
  if (!revealed){ stars[p.id] = Math.max(stars[p.id] || 0, s); store.set("stars", stars); burst(); }
  store.set("state"+p.id, null);
  showModal(`<div class="big">${img(revealed ? "magnifying_glass_tilted_left" : "jack-o-lantern")}</div><h3>${revealed ? "Die Lösung" : "Fall gelöst!"}</h3>
    ${revealed ? "" : `<div class="bigstars">${[0,1,2].map(i => `<span class="${i<s?"on":""}">${img("glowing_star")}</span>`).join("")}</div>`}
    <p><b style="color:${PCOL[p.killer]};font-weight:900">${esc(p.persons[p.killer])}</b> war als Einzige(r) mit ${esc(dat(p.persons[0]))} im Raum „${esc(room)}“ und ist der Täter!</p>
    ${revealed ? "" : `<p style="color:var(--muted);font-size:14px;margin-top:-6px">Zeit ${fmt(t)} · ${cur.hints ? cur.hints + (cur.hints === 1 ? " Tipp" : " Tipps") : "ohne Tipp"}</p>`}
    <div class="acts">${p.id < PUZZLES.length ? `<button class="btn go" id="wNext">Nächster Fall →</button>` : ""}<button class="btn" id="wMap">Zur Karte</button></div>`);
  const nx = document.getElementById("wNext"); if (nx) nx.onclick = () => { closeModal(); openCase(p.id + 1); };
  document.getElementById("wMap").onclick = () => { closeModal(); home(); };
}

const start = parseInt(location.hash.slice(1));
if (start >= 1 && start <= PUZZLES.length) openCase(start); else home();
</script>
</body>
</html>
