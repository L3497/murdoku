<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tatort-Raster</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="50 Krimi-Logikrätsel: Platziere die Verdächtigen und finde den Täter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: Rätselheft in Farbe – jeder Fall bekommt seinen eigenen Farbton (--h), Spielansicht passt auf einen Handybildschirm */
:root{
  --h:12;
  --ink:#1d1b2e; --muted:#5d5a72; --paper:#ffffff;
  --bg:hsl(var(--h) 85% 94%); --bg2:hsl(calc(var(--h) + 45) 90% 90%);
  --accent:hsl(var(--h) 72% 38%); --accent-soft:hsl(var(--h) 85% 88%);
  --wall:hsl(var(--h) 45% 20%);
  --pA:#e8590c; --pB:#1c7ed6; --pC:#2b9348; --pD:#9c36b5; --pE:#d6336c; --pV:#1d1b2e;
  --display:"Bricolage Grotesque",Georgia,serif; --body:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 0% 0%,var(--bg2) 0,transparent 55%),radial-gradient(circle at 100% 100%,hsl(calc(var(--h) - 40) 90% 91%) 0,transparent 50%);
  background-attachment:fixed;transition:background-color .4s}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-block:10px 24px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}

/* Startseite */
.hero{position:relative;border-radius:24px;padding:22px 20px 18px;margin-top:6px;color:#fff;overflow:hidden;
  background:linear-gradient(120deg,#ff6b3d 0%,#f72585 38%,#7209b7 70%,#3a0ca3 100%);box-shadow:0 10px 30px rgba(114,9,183,.25)}
.hero::after{content:"🔍";position:absolute;right:-6px;bottom:-18px;font-size:110px;opacity:.22;transform:rotate(-12deg)}
.hero .kicker{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.hero h1{font-size:clamp(36px,10vw,58px);font-weight:800;margin:4px 0 6px;letter-spacing:-.01em}
.hero p{margin:0;max-width:40ch;opacity:.95}
.hero-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.pill{background:rgba(255,255,255,.22);border-radius:999px;padding:6px 12px;font-weight:700;font-size:14px;backdrop-filter:blur(4px)}
.pill.btn{background:#fff;color:#7209b7}
.meter{flex:1;min-width:80px;height:8px;background:rgba(255,255,255,.3);border-radius:8px;overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:8px}
.group{margin-top:18px}
.group h3{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 2px 8px}
.group h3 small{font-family:var(--body);font-weight:600;color:var(--muted);font-size:13px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (min-width:700px){.tiles{grid-template-columns:repeat(10,1fr)}}
.tile{--h:0;position:relative;aspect-ratio:1;border-radius:14px;background:hsl(var(--h) 85% 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;
  box-shadow:inset 0 -4px 0 hsl(var(--h) 60% 62%);transition:transform .12s}
.tile:active{transform:scale(.94)}
.tile .e{font-size:22px;line-height:1}
.tile b{font-family:var(--display);font-size:15px;color:hsl(var(--h) 60% 20%);line-height:1.1;margin-top:2px}
.tile.done::after{content:"✓";position:absolute;top:-5px;right:-5px;width:20px;height:20px;border-radius:50%;background:#2b9348;color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--bg)}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.foot button{text-decoration:underline;color:var(--muted);font-size:12px;margin-top:4px}

/* Spielansicht */
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ib{width:40px;height:40px;flex:none;border-radius:12px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;box-shadow:0 2px 0 hsl(var(--h) 50% 80%)}
.top .t{flex:1;min-width:0}
.top h2{font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;color:var(--muted);font-weight:600}
.story{font-size:13px;line-height:1.35;background:var(--accent-soft);color:hsl(var(--h) 55% 22%);border-radius:12px;padding:7px 11px;margin-bottom:10px}
.story b{font-weight:800}
.play{display:grid;gap:10px}
@media (min-width:760px){.play{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);align-items:start;gap:20px}}
.boardcol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.board{display:grid;width:min(100%,520px,calc(100svh - 500px));min-width:260px;max-width:100%;aspect-ratio:1;border:4px solid var(--wall);border-radius:12px;overflow:hidden;background:var(--wall);gap:0;user-select:none;touch-action:manipulation;box-shadow:0 8px 24px hsl(var(--h) 50% 40% / .25)}
.cell{position:relative;display:flex;align-items:center;justify-content:center;font-size:clamp(17px,5vw,26px);cursor:pointer;border:1px solid hsl(var(--h) 30% 30% / .12)}
.cell.wt{border-top:3px solid var(--wall)}.cell.wb{border-bottom:3px solid var(--wall)}.cell.wl{border-left:3px solid var(--wall)}.cell.wr{border-right:3px solid var(--wall)}
.cell .rl{position:absolute;z-index:2;top:0;left:3px;font-size:8.5px;font-weight:800;color:hsl(var(--h) 40% 18% / .8);line-height:1.1;pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;letter-spacing:.03em;line-height:1.35;padding-top:2px}
.cell .obj{pointer-events:none;filter:saturate(1.15)}
.cell.deco::before{content:"";position:absolute;inset:3px;border-radius:5px;background:repeating-linear-gradient(45deg,hsl(var(--h) 40% 30% / .14) 0 3px,transparent 3px 7px);pointer-events:none}
.cell.blocked{background-image:linear-gradient(hsl(0 0% 0% / .06),hsl(0 0% 0% / .06))}
.cell .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:hsl(var(--h) 40% 25% / .55);font-size:clamp(18px,6vw,28px);font-weight:400;pointer-events:none}
.tok{position:absolute;width:74%;height:74%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-family:var(--display);font-size:clamp(14px,4.4vw,21px);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.3);pointer-events:none;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.5)}to{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.tok{animation:none}.tile{transition:none}}
.cell.conflict .tok{box-shadow:0 0 0 3px #e03131,0 3px 8px rgba(0,0,0,.3)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:center;font-size:12px;color:var(--muted);font-weight:600}
.legend .blk{color:#c92a2a}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.chip{display:flex;align-items:center;gap:4px;background:var(--paper);border-radius:999px;padding:2px 9px 2px 2px;font-size:12.5px;font-weight:700;box-shadow:0 2px 0 hsl(var(--h) 40% 82%);border:2px solid transparent}
.chip .d{width:22px;height:22px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;font-family:var(--display)}
.chip.sel{border-color:var(--ink)}
.chip.placed{opacity:.5}
.chip.mk .d{background:transparent;border:2px dashed var(--muted);color:var(--muted)}
.status{font-size:12.5px;color:var(--muted);font-weight:600;text-align:center;min-height:18px}
.status.warn{color:#c92a2a}
.clues{background:var(--paper);border-radius:16px;padding:6px;box-shadow:0 4px 16px hsl(var(--h) 50% 40% / .12);min-width:0}
.clue{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;padding:3px 7px;border-radius:9px;font-size:13.5px;line-height:1.35}
.clue .n{flex:none;width:20px;height:20px;border-radius:7px;background:var(--accent-soft);color:hsl(var(--h) 60% 25%);font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
.clue.used{color:#a6a3b8;text-decoration:line-through}
.clue.used .n{background:#ecebf2;color:#a6a3b8}
.clue.rule{font-weight:700;color:hsl(var(--h) 60% 28%)}
.clue.rule .n{background:var(--accent);color:#fff}
.nm{font-weight:800}

/* Dialoge */
.modal{position:fixed;inset:0;background:rgba(29,27,46,.55);display:none;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.modal.on{display:flex}
.card{background:var(--paper);border-radius:22px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center;max-height:100%;overflow:auto}
.card h3{font-size:24px;font-weight:800;margin-bottom:6px}
.card p{margin:6px 0 14px;color:var(--muted)}
.card .big{font-size:46px;line-height:1.2}
.card ul{text-align:left;padding-left:20px;margin:8px 0 14px}
.card li{margin:5px 0}
.acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.btn{border-radius:12px;padding:10px 16px;font-weight:800;background:#ecebf2}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 hsl(var(--h) 60% 35%)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
</style>
</head>

const PCOL = ["var(--pV)","var(--pA)","var(--pB)","var(--pC)","var(--pD)","var(--pE)"];
const BLOCKED = [3,4];
const LEVELS = {leicht:"leicht", mittel:"mittel"};
const app = document.getElementById("app"), modal = document.getElementById("modal"), card = document.getElementById("card");
const hueOf = id => Math.round((id * 137.508 + 12) % 360);
const store = {
  get(k,d){ try{ const v = localStorage.getItem("tatort:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("tatort:"+k, JSON.stringify(v)); }catch(e){} }
};
let solved = store.get("solved", {});
let cur = null;

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function tokLabel(p, i){ return i === 0 ? "☠" : p.persons[i][0]; }
function setHue(h){ document.documentElement.style.setProperty("--h", h); }
function dat(name){ return name.replace(/^Herr /, "Herrn "); }

function showModal(html){ card.innerHTML = html; modal.classList.add("on"); }
function closeModal(){ modal.classList.remove("on"); }
modal.addEventListener("click", e => { if (e.target === modal) closeModal(); });

function ask(msg, yes, onYes){
  showModal(`<h3>${esc(msg)}</h3><div class="acts" style="margin-top:16px"><button class="btn primary" id="aYes">${esc(yes)}</button><button class="btn" id="aNo">Abbrechen</button></div>`);
  document.getElementById("aNo").onclick = closeModal;
  document.getElementById("aYes").onclick = () => { closeModal(); onYes(); };
}

function rules(){
  showModal(`<div class="big">🕵️</div><h3>So wird ermittelt</h3><ul>
    <li>In jeder <b>Zeile</b> und jeder <b>Spalte</b> steht genau <b>eine</b> Person, auch das Opfer ☠.</li>
    <li>Auf <b>Hindernissen</b> (in der Legende rot markiert) kann niemand stehen.</li>
    <li>„Neben“ heißt direkt waagerecht oder senkrecht angrenzend.</li>
    <li>Der <b>Täter</b> ist die einzige Person, die mit dem Opfer im selben Raum war.</li>
    <li>Person antippen, dann Feld antippen. Mit ✕ schließt du Felder aus. Hinweise kannst du abhaken.</li>
  </ul><div class="acts"><button class="btn primary" id="rOk">Los geht's</button></div>`);
  document.getElementById("rOk").onclick = () => { store.set("seenRules", true); closeModal(); };
}

function home(){
  cur = null; setHue(285);
  try{ history.replaceState(null, "", location.pathname); }catch(e){}
  const n = Object.keys(solved).length;
  const groups = [["Einsteiger","4×4 · leicht",p=>p.n===4],["Ermittler","5×5 · leicht",p=>p.n===5&&p.level==="leicht"],["Kommissar","5×5 · mittel",p=>p.n===5&&p.level==="mittel"],["Meisterdetektiv","6×6 · mittel",p=>p.n===6]];
  let h = `<section class="hero"><div class="kicker">Krimi-Logikrätsel</div><h1>Tatort-Raster</h1>
    <p>50 Fälle, ein Prinzip: Stell alle an ihren Platz, dann weißt du, wer es war.</p>
    <div class="hero-row"><span class="pill">${n} / ${PUZZLES.length} gelöst</span><div class="meter"><i style="width:${n/PUZZLES.length*100}%"></i></div><button class="pill btn" id="rulesBtn">Regeln</button></div></section>`;
  for (const [name, sub, f] of groups){
    h += `<div class="group"><h3>${name} <small>${sub}</small></h3><div class="tiles">`;
    for (const p of PUZZLES.filter(f)){
      h += `<button class="tile${solved[p.id]?" done":""}" style="--h:${hueOf(p.id)}" data-id="${p.id}" aria-label="Fall ${p.id}: ${esc(p.title)}"><span class="e">${p.icon}</span><b>${p.id}</b></button>`;
    }
    h += `</div></div>`;
  }
  h += `<div class="foot">Alle Fälle sind eindeutig lösbar.<br><button id="resetAll">Fortschritt löschen</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll(".tile").forEach(b => b.onclick = () => openCase(+b.dataset.id));
  document.getElementById("rulesBtn").onclick = rules;
  document.getElementById("resetAll").onclick = () => ask("Gesamten Fortschritt löschen?", "Löschen", () => {
    solved = {}; store.set("solved", solved); PUZZLES.forEach(p => store.set("state"+p.id, null)); home(); });
  window.scrollTo(0,0);
}

function openCase(id){
  const p = PUZZLES.find(x => x.id === id);
  const st = store.get("state"+id, null);
  cur = { p, place: st ? st.place : p.persons.map(() => null), marks: new Set(st ? st.marks : []), used: new Set(st ? st.used : []), sel: 1, mark: false, msg: "", warn: false };
  if (cur.place[cur.sel]) { const f = cur.place.findIndex(x => !x); if (f >= 0) cur.sel = f; }
  setHue(hueOf(id));
  try{ history.replaceState(null, "", "#"+id); }catch(e){}
  render(); window.scrollTo(0,0);
  if (!store.get("seenRules", false)) rules();
}

function save(){ store.set("state"+cur.p.id, { place: cur.place, marks: [...cur.marks], used: [...cur.used] }); }
function whoAt(r,c){ return cur.place.findIndex(x => x && x[0]===r && x[1]===c); }
function conflicts(){
  const bad = new Set();
  cur.place.forEach((a,i) => { if (!a) return; cur.place.forEach((b,j) => { if (i!==j && b && (a[0]===b[0] || a[1]===b[1])) bad.add(i); }); });
  return bad;
}
function roomColor(k){ const h = hueOf(cur.p.id) + k * 61 + 20; return `hsl(${h % 360} 78% ${k % 2 ? 84 : 80}%)`; }

function clueHtml(text){
  // Namen fett hervorheben
  const ps = cur.p.persons, order = ps.map((_, i) => i).sort((a, b) => ps[b].length - ps[a].length);
  const re = new RegExp(order.map(i => ps[i].replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  let out = "", last = 0, m;
  while ((m = re.exec(text))){ const i = ps.indexOf(m[0]); out += esc(text.slice(last, m.index)) + `<span class="nm" style="color:${PCOL[i]}">${esc(m[0])}</span>`; last = m.index + m[0].length; }
  return out + esc(text.slice(last));
}

function render(){
  const p = cur.p, n = p.n, o = p.objects, bad = conflicts();
  const first = {}, span = {};
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const k = p.rooms[r][c]; let run = 1;
    while (c+run<n && p.rooms[r][c+run]===k) run++;
    if (!(k in span) || run > span[k] + (r - +first[k].split(",")[0]) * 0.34){ span[k] = run; first[k] = r+","+c; }
  }
  let g = "";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const k = p.rooms[r][c], t = p.cells[r][c], cls = ["cell"];
    if (r===0 || p.rooms[r-1][c]!==k) cls.push("wt");
    if (r===n-1 || p.rooms[r+1][c]!==k) cls.push("wb");
    if (c===0 || p.rooms[r][c-1]!==k) cls.push("wl");
    if (c===n-1 || p.rooms[r][c+1]!==k) cls.push("wr");
    if (BLOCKED.includes(t)) cls.push("blocked");
    if (t===2) cls.push("deco");
    const who = whoAt(r,c);
    if (who>=0 && bad.has(who)) cls.push("conflict");
    let inner = first[k]===r+","+c ? `<span class="rl" style="max-width:calc(${span[k]*100}% - 6px)">${esc(p.roomNames[k])}</span>` : "";
    if (t) inner += `<span class="obj">${o[t].emoji}</span>`;
    if (who>=0) inner += `<span class="tok" style="background:${PCOL[who]}">${esc(tokLabel(p, who))}</span>`;
    else if (cur.marks.has(r+","+c)) inner += `<span class="x">✕</span>`;
    g += `<div class="${cls.join(" ")}" style="background-color:${roomColor(k)}" data-r="${r}" data-c="${c}" title="${esc(p.roomNames[k])}${t?" · "+esc(o[t].name):""}">${inner}</div>`;
  }
  const chips = p.persons.map((nm,i) => `<button class="chip${!cur.mark && cur.sel===i?" sel":""}${cur.place[i]?" placed":""}" data-i="${i}"><span class="d" style="background:${PCOL[i]}">${esc(tokLabel(p,i))}</span>${esc(i===0 ? nm : nm)}</button>`).join("")
    + `<button class="chip mk${cur.mark?" sel":""}" id="mk"><span class="d">✕</span>Aus</button>`;
  const legend = [1,2,3,4].map(t => `<span${BLOCKED.includes(t)?' class="blk"':""}>${o[t].emoji} ${esc(o[t].name)}</span>`).join("");
  const clues = p.clues.map((c,i) => `<button class="clue${cur.used.has(i)?" used":""}" data-i="${i}"><span class="n">${i+1}</span><span>${clueHtml(c)}</span></button>`).join("");
  const status = cur.msg || (cur.mark ? "Tippe Felder an, um sie auszuschließen." : `${esc(p.persons[cur.sel])} ist gewählt. Tippe auf ein Feld.`);
  app.innerHTML = `
  <div class="top"><button class="ib" id="back" aria-label="Zur Übersicht">←</button>
    <div class="t"><h2>${p.icon} ${esc(p.title)}</h2><div class="sub">Fall ${p.id} · ${n}×${n} · ${LEVELS[p.level]}${solved[p.id]?" · ✓ gelöst":""}</div></div>
    <button class="ib" id="help" aria-label="Regeln">?</button><button class="ib" id="menu" aria-label="Optionen">⋯</button></div>
  <div class="story"><b>${esc(p.persons[0])}</b> wurde ${esc(p.place)} tot aufgefunden. Wer war mit dem Opfer allein im Raum?</div>
  <div class="play">
    <div class="boardcol">
      <div class="board" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${g}</div>
      <div class="legend">${legend}</div>
      <div class="chips">${chips}</div>
      <div class="status${cur.warn?" warn":""}">${status}</div>
    </div>
    <div class="clues">${clues}<div class="clue rule"><span class="n">!</span><span>Der Täter war als Einzige(r) mit dem Opfer im selben Raum.</span></div></div>
  </div>`;
  bind();
}

function bind(){
  document.getElementById("back").onclick = home;
  document.getElementById("help").onclick = rules;
  document.getElementById("menu").onclick = menu;
  app.querySelectorAll(".cell").forEach(el => el.onclick = () => tap(+el.dataset.r, +el.dataset.c));
  app.querySelectorAll(".chip[data-i]").forEach(el => el.onclick = () => { cur.sel = +el.dataset.i; cur.mark = false; cur.msg = ""; cur.warn = false; render(); });
  document.getElementById("mk").onclick = () => { cur.mark = !cur.mark; cur.msg = ""; cur.warn = false; render(); };
  app.querySelectorAll(".clue[data-i]").forEach(el => el.onclick = () => { const i = +el.dataset.i; cur.used.has(i) ? cur.used.delete(i) : cur.used.add(i); save(); render(); });
}

function menu(){
  const p = cur.p;
  showModal(`<h3>Fall ${p.id}</h3><p>${esc(p.title)}</p><div class="acts" style="flex-direction:column">
    <button class="btn" id="mReset">↺ Neu anfangen</button>
    <button class="btn" id="mReveal">🔎 Lösung zeigen</button>
    ${p.id < PUZZLES.length ? `<button class="btn" id="mNext">Nächster Fall →</button>` : ""}
    <button class="btn primary" id="mClose">Weiter ermitteln</button></div>`);
  document.getElementById("mClose").onclick = closeModal;
  document.getElementById("mReset").onclick = () => { closeModal(); ask("Diesen Fall zurücksetzen?", "Zurücksetzen", () => {
    cur.place = p.persons.map(() => null); cur.marks.clear(); cur.used.clear(); cur.sel = 1; cur.msg = ""; cur.warn = false; save(); render(); }); };
  document.getElementById("mReveal").onclick = () => { closeModal(); ask("Wirklich die Lösung zeigen?", "Lösung zeigen", () => {
    cur.place = p.solution.map(x => [...x]); save(); render(); result(true); }); };
  const nx = document.getElementById("mNext"); if (nx) nx.onclick = () => { closeModal(); openCase(p.id + 1); };
}

function tap(r,c){
  const p = cur.p, key = r+","+c;
  cur.msg = ""; cur.warn = false;
  if (cur.mark){
    if (whoAt(r,c) >= 0) return;
    cur.marks.has(key) ? cur.marks.delete(key) : cur.marks.add(key);
    save(); render(); return;
  }
  if (BLOCKED.includes(p.cells[r][c])){ cur.msg = `${p.objects[p.cells[r][c]].name}: Hier kann niemand stehen.`; cur.warn = true; render(); return; }
  const who = whoAt(r,c);
  if (who >= 0){
    cur.place[who] = null;
    if (who !== cur.sel){ cur.sel = who; save(); render(); return; }
  } else {
    cur.place[cur.sel] = [r,c];
    cur.marks.delete(key);
    const nf = p.persons.findIndex((_,i) => !cur.place[i]);
    if (nf >= 0) cur.sel = nf;
  }
  save();
  if (cur.place.every(x => x)){
    const ok = p.solution.every((s,i) => cur.place[i][0]===s[0] && cur.place[i][1]===s[1]);
    if (ok){ render(); result(false); return; }
    cur.msg = "Alle platziert, aber etwas stimmt noch nicht. Prüfe die Hinweise."; cur.warn = true;
  }
  render();
}

function confetti(){
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["#ff6b3d","#f72585","#7209b7","#4cc9f0","#2b9348","#ffd43b"];
  for (let i=0;i<70;i++){
    const e = document.createElement("i");
    e.style.left = Math.random()*100 + "%"; e.style.background = cols[i % cols.length];
    e.style.animationDelay = Math.random()*0.5 + "s"; e.style.animationDuration = 1.2 + Math.random()*1 + "s";
    box.appendChild(e);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 2800);
}

function result(revealed){
  const p = cur.p, [vr,vc] = p.solution[0], room = p.roomNames[p.rooms[vr][vc]];
  if (!revealed){ solved[p.id] = true; store.set("solved", solved); confetti(); }
  showModal(`<div class="big">${revealed ? "🔎" : "🎉"}</div><h3>${revealed ? "Die Auflösung" : "Fall gelöst!"}</h3>
    <p><b style="color:${PCOL[p.killer]}">${esc(p.persons[p.killer])}</b> war als Einzige(r) mit ${esc(dat(p.persons[0]))} im Raum „${esc(room)}“ und ist damit der Täter.</p>
    <div class="acts">${p.id < PUZZLES.length ? `<button class="btn primary" id="rNext">Nächster Fall →</button>` : ""}<button class="btn" id="rHome">Übersicht</button></div>`);
  const nx = document.getElementById("rNext"); if (nx) nx.onclick = () => { closeModal(); openCase(p.id + 1); };
  document.getElementById("rHome").onclick = () => { closeModal(); home(); };
}

const start = parseInt(location.hash.slice(1));
if (start >= 1 && start <= PUZZLES.length) openCase(start); else home();
</script>
