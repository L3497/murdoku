<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tatort-Raster</title>
<meta name="description" content="50 Krimi-Logikrätsel: Platziere die Verdächtigen und finde den Täter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --paper:#fffaf1; --ink:#221c17; --muted:#6f655b; --line:#d9cfc0;
  --accent:#b3261e; --accent-ink:#fff; --ok:#2e7d4f; --wall:#3a2f27;
  --r0:#f6d9c4; --r1:#d5e6cf; --r2:#d3dff0; --r3:#efe1b0; --r4:#e6d3ec; --r5:#cfe8e6;
  --shadow:0 1px 2px rgba(40,25,10,.08),0 6px 20px rgba(40,25,10,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130f; --paper:#221c17; --ink:#f1e9dd; --muted:#a99c8d; --line:#3d342c;
  --accent:#e2574c; --accent-ink:#1a0f0d; --ok:#5fbf86; --wall:#d8c8b4;
  --r0:#4a3528; --r1:#2f4030; --r2:#2c3a4d; --r3:#4a4226; --r4:#41314a; --r5:#28423f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --bg:#17130f; --paper:#221c17; --ink:#f1e9dd; --muted:#a99c8d; --line:#3d342c;
  --accent:#e2574c; --accent-ink:#1a0f0d; --ok:#5fbf86; --wall:#d8c8b4;
  --r0:#4a3528; --r1:#2f4030; --r2:#2c3a4d; --r3:#4a4226; --r4:#41314a; --r5:#28423f;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;line-height:1.15}
header.home{padding:28px 0 8px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
header.home h1{font-size:clamp(34px,8vw,52px);font-weight:800;margin:6px 0 8px}
header.home p{color:var(--muted);margin:0;max-width:52ch}
.stats{display:flex;gap:10px;align-items:center;margin:16px 0 4px;color:var(--muted);font-size:14px}
.bar{flex:1;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
details.rules{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin:18px 0;box-shadow:var(--shadow)}
details.rules summary{font-weight:600;cursor:pointer}
details.rules ul{margin:10px 0 2px;padding-left:20px}
details.rules li{margin:4px 0}
.section-title{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.lvl{text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);position:relative;min-height:74px;transition:transform .1s}
.lvl:active{transform:scale(.98)}
.lvl b{font-family:Fraunces,Georgia,serif;font-size:22px;display:block;line-height:1}
.lvl span{display:block;font-size:13px;margin-top:4px;line-height:1.3}
.lvl small{color:var(--muted);font-size:12px}
.lvl.done{border-color:var(--ok)}
.lvl.done::after{content:"✓";position:absolute;top:8px;right:10px;color:var(--ok);font-weight:700}
.topbar{display:flex;align-items:center;gap:10px;padding:4px 0 12px}
.iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;font-weight:600}
.topbar .t{flex:1;min-width:0}
.topbar h2{font-size:22px}
.topbar .sub{font-size:13px;color:var(--muted)}
.story{background:var(--paper);border-left:4px solid var(--accent);border-radius:0 12px 12px 0;padding:10px 14px;margin:4px 0 14px;font-size:15px}
.board-wrap{display:flex;justify-content:center}
.board{display:grid;gap:0;border:3px solid var(--wall);border-radius:6px;overflow:hidden;width:min(100%,440px);aspect-ratio:1;touch-action:manipulation;user-select:none}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.08);font-size:clamp(18px,5.5vw,28px);cursor:pointer}
.cell.wt{border-top:3px solid var(--wall)} .cell.wb{border-bottom:3px solid var(--wall)}
.cell.wl{border-left:3px solid var(--wall)} .cell.wr{border-right:3px solid var(--wall)}
.cell .rl{position:absolute;top:2px;left:4px;font-size:9px;font-weight:700;letter-spacing:.02em;color:var(--ink);opacity:.7;line-height:1;pointer-events:none;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .obj{opacity:.9;pointer-events:none}
.cell.blocked .obj{opacity:1}
.cell.deco{background-image:repeating-linear-gradient(45deg,rgba(120,80,40,.13) 0 4px,transparent 4px 9px)}
.cell .x{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:clamp(20px,6vw,30px);font-weight:300;pointer-events:none}
.token{position:absolute;width:72%;height:72%;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:clamp(13px,4vw,18px);box-shadow:0 2px 6px rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.85);pointer-events:none}
.token.victim{background:#2b2b2b!important;border-color:var(--accent)}
.cell.conflict .token{outline:3px solid var(--accent);outline-offset:1px}
.cell.hl{box-shadow:inset 0 0 0 3px var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:10px 0 0;justify-content:center}
.people{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 6px;justify-content:center}
.chip{display:flex;align-items:center;gap:6px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px 5px 5px;font-size:14px;font-weight:600}
.chip .dot{width:24px;height:24px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.chip.sel{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.chip.placed{opacity:.55}
.chip.mark .dot{background:transparent!important;color:var(--muted);border:2px dashed var(--muted)}
.hint{text-align:center;font-size:13px;color:var(--muted);min-height:20px}
.clues{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:6px 6px;margin:14px 0;box-shadow:var(--shadow)}
.clues h3{font-size:17px;padding:8px 10px 4px}
.clue{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 10px;border-radius:8px;font-size:15px}
.clue:hover{background:rgba(127,127,127,.07)}
.clue .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--line);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.clue.used{color:var(--muted);text-decoration:line-through}
.clue.rule .n{background:var(--accent);color:var(--accent-ink)}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 16px;font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.45;cursor:default}
.modal{position:fixed;inset:0;background:rgba(10,6,3,.55);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.card{background:var(--paper);border-radius:18px;max-width:420px;width:100%;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
.card h3{font-size:26px;margin-bottom:8px}
.card p{margin:8px 0 16px;color:var(--muted)}
.card .big{font-size:44px}
.footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
.hidden{display:none!important}
.themebtn{position:absolute;top:16px;right:16px}
</style>
</head>

te.","Lotte war weiter links als Ida.","Herr Vogel war weiter oben als Ida.","Lotte war weiter oben als Nele.","Ida war weiter oben als Pia."]},{"id":50,"title":"Das Rätsel der Villa","place":"in der Villa Rosenrot","level":"mittel","n":6,"rooms":[[3,0,0,2,2,2],[3,0,0,0,2,2],[3,3,0,0,1,1],[3,3,3,1,1,1],[3,3,4,1,1,4],[4,4,4,4,4,4]],"roomNames":["Bibliothek","Speisezimmer","Arbeitszimmer","Salon","Wintergarten"],"cells":[[1,1,0,0,0,0],[3,2,0,0,2,3],[3,2,0,0,0,0],[0,0,4,0,0,0],[4,1,1,0,2,0],[0,3,0,1,4,2]],"objects":{"1":{"name":"Sessel","emoji":"🪑"},"2":{"name":"Teppich","emoji":"🟫"},"3":{"name":"Flügel","emoji":"🎹"},"4":{"name":"Standuhr","emoji":"🕰️"}},"persons":["Frau Hartmann","Bruno","Lukas","Noah","Gustav","Rudi"],"solution":[[5,0],[3,5],[2,4],[4,2],[1,3],[0,1]],"killer":3,"clues":["Rudi saß auf einem Sessel.","Bruno war in der 4. Reihe von oben.","Frau Hartmann war direkt neben einem Flügel.","Noah war direkt neben einer Standuhr.","Gustav stand nicht auf einem Teppich.","Gustav saß nicht auf einem Sessel.","Bruno und Lukas waren diagonal direkt nebeneinander.","Lukas war weiter links als Bruno.","Noah war weiter links als Gustav.","Rudi war weiter oben als Frau Hartmann."]}];
const COLORS = ["#2b2b2b","#c2410c","#1d6fb8","#2e8b57","#8e44ad","#b8860b","#c0396b"];
const BLOCKED = [3,4];
const app = document.getElementById("app");
const store = {
  get(k, d){ try{ const v = localStorage.getItem("tatort:"+k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem("tatort:"+k, JSON.stringify(v)); }catch(e){} }
};
let solved = store.get("solved", {});
let cur = null; // {p, place:[[r,c]|null], marks:Set, used:Set, sel}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function initial(name){ const parts = name.split(" "); return parts[parts.length-1][0]; }

function home(){
  cur = null;
  history.replaceState(null, "", location.pathname);
  const n = Object.keys(solved).length;
  let h = `<header class="home"><div class="kicker">Krimi-Logikrätsel</div><h1>Tatort-Raster</h1>
  <p>50 Fälle, ein Prinzip: Platziere alle Personen am Tatort – dann weißt du, wer es war.</p>
  <div class="stats"><span>${n} / ${PUZZLES.length} gelöst</span><div class="bar"><i style="width:${n/PUZZLES.length*100}%"></i></div></div></header>
  <details class="rules"${n ? "" : " open"}><summary>So wird gespielt</summary><ul>
  <li>In jeder <b>Zeile</b> und jeder <b>Spalte</b> steht genau <b>eine</b> Person – auch das Opfer.</li>
  <li>Auf Hindernissen (unter dem Raster als „Hindernis“ gekennzeichnet) kann niemand stehen. Sitz- und Bodenfelder sind betretbar.</li>
  <li>„Neben“ heißt direkt waagerecht oder senkrecht angrenzend, „diagonal nebeneinander“ heißt schräg angrenzend.</li>
  <li><b>Der Täter</b> ist die einzige Person, die mit dem Opfer im selben Raum war. Jeder Fall ist eindeutig lösbar.</li>
  <li>Person antippen, dann Feld antippen. Mit „✕ Markieren“ kannst du Felder ausschließen. Hinweise lassen sich abhaken.</li>
  </ul></details>`;
  const groups = [["4 × 4 · leicht", p => p.n===4],["5 × 5 · leicht", p => p.n===5 && p.level==="leicht"],["5 × 5 · mittel", p => p.n===5 && p.level==="mittel"],["6 × 6 · mittel", p => p.n===6]];
  for (const [label, f] of groups){
    h += `<div class="section-title">${label}</div><div class="levels">`;
    for (const p of PUZZLES.filter(f)){
      h += `<button class="lvl${solved[p.id] ? " done" : ""}" data-id="${p.id}"><b>${p.id}</b><span>${esc(p.title)}</span><small>${p.n}×${p.n} · ${p.level}</small></button>`;
    }
    h += `</div>`;
  }
  h += `<div class="footer">Alle Rätsel sind Eigenkreationen und rechnerisch auf eine eindeutige Lösung geprüft.<br><button class="btn" id="resetAll" style="margin-top:10px;font-size:12px;padding:6px 10px">Fortschritt löschen</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll(".lvl").forEach(b => b.onclick = () => open(+b.dataset.id));
  document.getElementById("resetAll").onclick = () => {
    if (confirm("Gesamten Fortschritt löschen?")){ solved = {}; store.set("solved", solved); PUZZLES.forEach(p => store.set("state"+p.id, null)); home(); }
  };
  window.scrollTo(0,0);
}

function open(id){
  const p = PUZZLES.find(x => x.id === id);
  const st = store.get("state"+id, null);
  cur = { p, place: st ? st.place : p.persons.map(() => null), marks: new Set(st ? st.marks : []), used: new Set(st ? st.used : []), sel: 0, markMode:false };
  history.replaceState(null, "", "#"+id);
  render();
  window.scrollTo(0,0);
}

function save(){ store.set("state"+cur.p.id, { place: cur.place, marks: [...cur.marks], used: [...cur.used] }); }

function whoAt(r, c){ return cur.place.findIndex(x => x && x[0]===r && x[1]===c); }

function conflicts(){
  const bad = new Set();
  cur.place.forEach((a, i) => { if (!a) return;
    cur.place.forEach((b, j) => { if (i!==j && b && (a[0]===b[0] || a[1]===b[1])) bad.add(i); });
  });
  return bad;
}

function render(){
  const p = cur.p, n = p.n;
  const objs = p.objects;
  const bad = conflicts();
  const labelCell = {};
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){ const k = p.rooms[r][c]; if (!(k in labelCell)) labelCell[k] = r+","+c; }
  let g = "";
  for (let r=0;r<n;r++) for (let c=0;c<n;c++){
    const k = p.rooms[r][c], t = p.cells[r][c];
    const cls = ["cell"];
    if (r===0 || p.rooms[r-1][c]!==k) cls.push("wt");
    if (r===n-1 || p.rooms[r+1][c]!==k) cls.push("wb");
    if (c===0 || p.rooms[r][c-1]!==k) cls.push("wl");
    if (c===n-1 || p.rooms[r][c+1]!==k) cls.push("wr");
    if (BLOCKED.includes(t)) cls.push("blocked");
    if (t===2) cls.push("deco");
    const who = whoAt(r,c);
    if (who>=0 && bad.has(who)) cls.push("conflict");
    let inner = labelCell[k]===r+","+c ? `<span class="rl">${esc(p.roomNames[k])}</span>` : "";
    if (t) inner += `<span class="obj">${objs[t].emoji}</span>`;
    if (who>=0){
      inner += `<span class="token${who===0?" victim":""}" style="background:${COLORS[who]}">${who===0?"☠":esc(initial(p.persons[who]))}</span>`;
    } else if (cur.marks.has(r+","+c)) inner += `<span class="x">✕</span>`;
    g += `<div class="${cls.join(" ")}" style="background-color:var(--r${k})" data-r="${r}" data-c="${c}" title="${esc(p.roomNames[k])}${t?" · "+esc(objs[t].name):""}">${inner}</div>`;
  }
  const allPlaced = cur.place.every(x => x);
  let chips = p.persons.map((name, i) => `<button class="chip${!cur.markMode && cur.sel===i?" sel":""}${cur.place[i]?" placed":""}" data-i="${i}"><span class="dot" style="background:${COLORS[i]}">${i===0?"☠":esc(initial(name))}</span>${esc(name)}${i===0?" (Opfer)":""}</button>`).join("");
  chips += `<button class="chip mark${cur.markMode?" sel":""}" id="markBtn"><span class="dot">✕</span>Markieren</button>`;
  const legend = [1,2,3,4].map(t => `<span>${objs[t].emoji} ${esc(objs[t].name)}${BLOCKED.includes(t)?" <b>(Hindernis)</b>":""}</span>`).join("");
  const clues = p.clues.map((c, i) => `<button class="clue${cur.used.has(i)?" used":""}" data-i="${i}"><span class="n">${i+1}</span><span>${esc(c)}</span></button>`).join("");
  const done = !!solved[p.id];
  app.innerHTML = `
  <div class="topbar"><button class="iconbtn" id="back">← Fälle</button>
    <div class="t"><h2>Fall ${p.id}: ${esc(p.title)}</h2><div class="sub">${p.n}×${p.n} · ${p.level}${done?" · ✓ gelöst":""}</div></div></div>
  <div class="story">${esc(p.persons[0])} wurde ${esc(p.place)} tot aufgefunden. Wer war mit dem Opfer allein im Raum?</div>
  <div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${n},1fr);grid-template-rows:repeat(${n},1fr)">${g}</div></div>
  <div class="legend">${legend}</div>
  <div class="people">${chips}</div>
  <div class="hint" id="hint">${cur.markMode ? "Tippe Felder an, um sie auszuschließen." : "Gewählt: " + esc(p.persons[cur.sel]) + " – tippe auf ein Feld."}</div>
  <div class="clues"><h3>Hinweise</h3>${clues}
    <button class="clue rule" disabled><span class="n">!</span><span>Der Täter war als Einzige(r) mit dem Opfer im selben Raum.</span></button></div>
  <div class="actions">
    <button class="btn primary" id="check" ${allPlaced?"":"disabled"}>Lösung prüfen</button>
    <button class="btn" id="reset">Zurücksetzen</button>
    <button class="btn" id="reveal">Lösung zeigen</button>
    ${p.id < PUZZLES.length ? `<button class="btn" id="next">Nächster Fall →</button>` : ""}
  </div>`;
  bind();
}

function bind(){
  document.getElementById("back").onclick = home;
  app.querySelectorAll(".cell").forEach(el => el.onclick = () => tapCell(+el.dataset.r, +el.dataset.c));
  app.querySelectorAll(".chip[data-i]").forEach(el => el.onclick = () => { cur.sel = +el.dataset.i; cur.markMode = false; render(); });
  document.getElementById("markBtn").onclick = () => { cur.markMode = !cur.markMode; render(); };
  app.querySelectorAll(".clue[data-i]").forEach(el => el.onclick = () => { const i = +el.dataset.i; cur.used.has(i) ? cur.used.delete(i) : cur.used.add(i); save(); render(); });
  document.getElementById("check").onclick = check;
  document.getElementById("reset").onclick = () => { if (confirm("Dieses Rätsel zurücksetzen?")){ cur.place = cur.p.persons.map(()=>null); cur.marks.clear(); cur.used.clear(); save(); render(); } };
  document.getElementById("reveal").onclick = () => { if (confirm("Wirklich die Lösung anzeigen?")){ cur.place = cur.p.solution.map(x => [...x]); save(); render(); showResult(true, true); } };
  const nx = document.getElementById("next"); if (nx) nx.onclick = () => open(cur.p.id + 1);
}

function tapCell(r, c){
  const p = cur.p, key = r+","+c;
  if (cur.markMode){
    if (whoAt(r,c) >= 0) return;
    cur.marks.has(key) ? cur.marks.delete(key) : cur.marks.add(key);
    save(); render(); return;
  }
  if (BLOCKED.includes(p.cells[r][c])){ flash(p.objects[p.cells[r][c]].name + " ist ein Hindernis – hier kann niemand stehen."); return; }
  const who = whoAt(r,c);
  if (who >= 0){
    cur.place[who] = null;
    if (who !== cur.sel){ cur.sel = who; save(); render(); return; }
  } else {
    cur.place[cur.sel] = [r,c];
    cur.marks.delete(key);
    const nextFree = p.persons.findIndex((_, i) => !cur.place[i]);
    if (nextFree >= 0) cur.sel = nextFree;
  }
  save(); render();
}

function flash(msg){ const h = document.getElementById("hint"); if (h){ h.textContent = msg; h.style.color = "var(--accent)"; } }

function check(){
  const ok = cur.p.solution.every((s, i) => cur.place[i] && cur.place[i][0]===s[0] && cur.place[i][1]===s[1]);
  showResult(ok, false);
}

function showResult(ok, revealed){
  const p = cur.p, m = document.getElementById("modal"), card = document.getElementById("modalCard");
  const killer = p.persons[p.killer];
  const [vr, vc] = p.solution[0];
  const room = p.roomNames[p.rooms[vr][vc]];
  if (ok){
    if (!revealed){ solved[p.id] = true; store.set("solved", solved); }
    card.innerHTML = `<div class="big">${revealed ? "🔎" : "🕵️"}</div><h3>${revealed ? "Die Auflösung" : "Fall gelöst!"}</h3>
      <p><b style="color:var(--ink)">${esc(killer)}</b> war als Einzige(r) mit ${esc(p.persons[0].replace(/^Herr /, "Herrn "))} im Raum „${esc(room)}“ – und ist damit der Täter.</p>
      <div class="actions">${p.id < PUZZLES.length ? `<button class="btn primary" id="mNext">Nächster Fall →</button>` : ""}<button class="btn" id="mClose">Schließen</button></div>`;
  } else {
    card.innerHTML = `<div class="big">🤔</div><h3>Noch nicht ganz</h3><p>Mindestens eine Person steht falsch. Prüfe Zeilen, Spalten und die Hinweise noch einmal.</p>
      <div class="actions"><button class="btn primary" id="mClose">Weiter ermitteln</button></div>`;
  }
  m.classList.add("on");
  document.getElementById("mClose").onclick = () => { m.classList.remove("on"); render(); };
  const mn = document.getElementById("mNext"); if (mn) mn.onclick = () => { m.classList.remove("on"); open(p.id + 1); };
}

document.getElementById("modal").addEventListener("click", e => { if (e.target.id === "modal"){ e.currentTarget.classList.remove("on"); if (cur) render(); } });

const start = parseInt(location.hash.slice(1));
if (start >= 1 && start <= PUZZLES.length) open(start); else home();
</script>
